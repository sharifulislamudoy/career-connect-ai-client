<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <title>Offline | Creative Career AI</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; color: #111827; background: #eff6ff; }
      main { width: min(100%, 400px); padding: 32px; border-radius: 24px; background: white; text-align: center; box-shadow: 0 12px 40px #1e40af12; }
      img { width: 80px; height: 80px; }
      h1 { font-size: 24px; margin: 20px 0 12px; }
      p { color: #64748b; line-height: 1.6; }
      a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #2563eb; color: white; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Creative Career AI" />
      <h1>You're offline</h1>
      <p>Connect to the internet to browse jobs, send messages, and use your AI career tools.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
